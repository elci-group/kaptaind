# kaptaind configuration — automated semantic versioning, commits, and releases.
# Copy this file to kaptaind.toml in your repo root and adjust values as needed.

# Filesystem watcher settings.
[watch]
path = "."                    # Directory to watch (relative to repo_path)
recursive = true              # Watch subdirectories
ignore_file = ".kaptainignore" # Path to custom ignore rules

# Event clustering controls how file changes are batched into a single commit.
[cluster]
window = 5                    # Base window in seconds; events within this span group together
adaptive = true               # Expand the window during event bursts
min_window_secs = 2           # Never shrink the effective window below this
max_window_secs = 60          # Never expand the effective window beyond this
burst_threshold = 20          # Event count at which the window reaches max_window_secs
max_paths = 25                # Force a cluster flush once this many paths are queued
flush_after = 10              # Force a cluster flush after this many events

# Scoring weights: how much each dimension contributes to the final bump score.
[weights]
s = 0.30                      # Structural weight (event density, path spread, churn)
a = 0.35                      # API surface weight (public symbol changes)
d = 0.20                      # Dependency manifest weight
r = 0.15                      # Runtime / config weight

# Automated git push behavior.
[push]
enabled = true                # Set to false to commit without pushing
branch = "main"               # Target branch when pushing

# Security capability flags for locked-down / air-gapped environments.
[capabilities]
network_push = true           # Allow outgoing git push

# Rate limiting between automated commits.
[ratelimit]
min_commit_interval = 10      # Minimum seconds between commits

# Daemon runtime behavior.
[daemon]
# Refuse to start while the worktree has uncommitted changes. This repo is a
# release tree — daemon runs here are exceptional (see AGENTS.md), and an
# accidental start must not catch-up-commit in-flight work. `--force` overrides.
startup_guard = true

# Version bump thresholds. Score must exceed these to trigger Patch or Minor.
[version_thresholds]
patch = 0.0                   # Any non-zero score triggers a patch bump
minor = 0.6                   # Score above this triggers a minor bump

# Workspace version writeback policy (dogfooding the workspace bumping plan).
# "touched": bump only the members a cluster touched, plus the root crate when
# the cluster touched paths outside every member subtree. See
# docs/planning/WORKSPACE_VERSION_BUMPING_PLAN.md.
[versioning]
workspace = "touched"

# Pre-commit validation hook.
[test]
command = "cargo test --tests" # Shell command run before each commit
required = false              # When true, a failing hook blocks the commit

# Staging controls which files are included in automated commits.
[staging]
mode = "cluster"              # "all", "cluster" (changed files only), or "pattern"
exclude = [
  "*.log",
  ".env*",
  "*.db",
  "*.sqlite",
  "node_modules/**",
  "dist/**",
  "target/**",
  ".kaptaind/**",
]

# Automated storage hygiene for build caches and artifacts.
[deckhand]
enabled = false               # Set to true to enable periodic cleanup
interval_minutes = 360        # How often to evaluate cleanup
sweep_keep_days = 30          # Keep artifacts newer than this many days
clean_profiles = ["debug"]    # Cargo/Node profiles to clean
# clean_older_than_days = 14  # Only clean artifacts older than this (when set)
dry_run = false               # Log what would be deleted without removing files
min_free_percent = 10         # Skip cleanup if free disk space is above this %

# High-availability leader election for zero-downtime upgrades.
[shark]
enabled = false               # Set to true to participate in HA leadership
arbiter_path = ".kaptaind/shark" # Shared filesystem arbiter directory
heartbeat_interval_ms = 1000  # Leader heartbeat cadence
heartbeat_timeout_ms = 5000   # Time before a standby considers the leader gone
lease_ttl_ms = 10000          # Lease duration the leader holds
# instance_id = "kaptaind-a"  # Optional unique instance identifier
upgrade_handoff_timeout_ms = 30000 # Max time to wait for graceful handoff
mode = "auto"                 # "auto", "leader", "standby", or "observer"

