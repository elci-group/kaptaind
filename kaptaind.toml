# kaptaind configuration — Vico ecosystem monitoring

[watch]
path = "."
recursive = true
ignore_file = ".kaptainignore"

[cluster]
window = 5
adaptive = true
min_window_secs = 2
max_window_secs = 60
burst_threshold = 20
max_paths = 25
flush_after = 10

[weights]
s = 0.30
a = 0.35
d = 0.20
r = 0.15

[push]
enabled = true
branch = "main"

[ratelimit]
min_commit_interval = 10

[version_thresholds]
patch = 0.0
minor = 0.6

[test]
command = "cargo test --tests"
required = false

[staging]
mode = "cluster"
exclude = [
  "*.log",
  ".env*",
  "*.db",
  "*.sqlite",
  "node_modules/**",
  "dist/**",
  "target/**",
  ".kaptaind/**",

]

[deckhand]
enabled = false
interval_minutes = 360
sweep_keep_days = 30
clean_profiles = ["debug"]
# clean_older_than_days = 14
dry_run = false
min_free_percent = 10

[shark]
enabled = false
arbiter_path = ".kaptaind/shark"
heartbeat_interval_ms = 1000
heartbeat_timeout_ms = 5000
lease_ttl_ms = 10000
# instance_id = "kaptaind-a"
upgrade_handoff_timeout_ms = 30000
mode = "auto"

