# Stable release overrides. Publishes a non-prerelease GitHub release, tags the
# repo as `v{VERSION}`, and generates release notes from commits since the
# previous stable release.
# [ship.stable]
# targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
# channels = ["binaries", "github-releases"]
# push_tag = true
# require_qualification = true
# release_notes = true
#
# Nightly release overrides. Publishes a prerelease with a version like
# `0.1.2-nightly.20260707.abc1234`, skips qualification gates by default, and
# skips re-shipping the same date+commit unless `--force` is used.
# [ship.nightly]
# targets = ["x86_64-unknown-linux-gnu"]
# channels = ["binaries", "github-releases"]
# draft = true
# push_tag = false
# require_qualification = false
# release_notes = true
# retain_count = 7
#
# Automated daemon-driven release trains. When enabled, the scheduler will run
# the ship pipeline on the configured cron schedule, log to audit, and send
# nautical release notifications.
# [ship.auto_nightly]
# enabled = false
# schedule = "0 2 * * *"      # min hour day month weekday
# cron_timezone = "local"     # "local" or "utc"
# require_qualification = false
#
# [ship.auto_stable]
# enabled = false
# schedule = "0 9 * * 1"      # e.g. 09:00 every Monday
# cron_timezone = "local"
# require_qualification = true
#
# SLSA provenance attestation for release artifacts.
# [ship.provenance]
# enabled = false
# builder_id = "https://kaptaind.dev/builder"
# build_type = "https://kaptaind.dev/build"

# GPG-signed automated commits.
# [commit]
# sign = false              # GPG-sign every automated commit
# gpg_key_id = "your-key@example.com"  # Key ID or email; omit to use git default

# Push safety gates (GitHub status-check enforcement).
# [push.protection]
# require_ci_pass = false                  # Block push until required checks pass
# required_status_checks = ["ci/tests", "ci/lint"]
# github_token_env = "GITHUB_TOKEN"        # PAT env var for GitHub API queries

# Role-based access control for multi-user installs.
# [[rbac.roles]]
# name = "admin"
# permissions = ["*"]
# users = []
# groups = []

# Notification settings: desktop hooks, webhooks, audit logging.
[notify]
# Toggle the nautical emoji theme for all notification renderers.
nautical_theme = true

# Minimum seconds between duplicate event notifications. Set to 0 to disable.
rate_limit_seconds = 5

# Shell hooks are executed with `sh -c`. Available env vars depend on the event:
#   Commit:     KAPTAIND_EVENT=commit, KAPTAIND_VERSION, KAPTAIND_SCORE, KAPTAIND_MSG, KAPTAIND_FILES
#   Push:       KAPTAIND_EVENT=push_success|push_failure, KAPTAIND_VERSION, KAPTAIND_BRANCH, KAPTAIND_REMOTE, KAPTAIND_ERROR
#   Start/Stop: KAPTAIND_EVENT=start|stop, KAPTAIND_REPO_PATH
#   Error:      KAPTAIND_EVENT=error, KAPTAIND_ERROR, KAPTAIND_CONTEXT
# on_commit = 'notify-send "Kaptaind Bump" "Version $KAPTAIND_VERSION"'
# on_push = 'notify-send "Kaptaind Push" "Shipped $KAPTAIND_VERSION to $KAPTAIND_REMOTE/$KAPTAIND_BRANCH"'
# on_error = 'notify-send -u critical "Kaptaind Error" "$KAPTAIND_ERROR"'
# on_start = 'notify-send "Kaptaind" "On watch for $KAPTAIND_REPO_PATH"'
# on_shutdown = 'notify-send "Kaptaind" "Dropping anchor"'

# Generic Discord or Slack webhook for commit/push/error/start/stop events.
# webhook_url = "https://discord.com/api/webhooks/..."

# Structured audit logging for compliance and incident response.
# [audit]
# enabled = true

# ---------------------------------------------------------------------------
# Build step used by `kaptaind-cli ship` to produce the host-target binaries.
# The host build reuses this command; cross targets use `cargo build --target`.
# ---------------------------------------------------------------------------
[build]
command = "cargo build --release --bin kaptaind --bin kaptaind-cli"
artifact_path = "target/release/kaptaind"
timeout_secs = 1200

# ---------------------------------------------------------------------------
# Release pipeline. `kaptaind-cli ship stable` builds the configured targets,
# packages tarballs + SHA256 checksums, and publishes a GitHub release.
#
# Signing is disabled here because no GPG key is present on this host; the
# canonical multi-arch, keyless-signed (cosign/Sigstore) release is produced by
# `.github/workflows/release.yml`. Targets are host-only locally — the CI matrix
# builds linux x86_64/arm64, macOS x86_64/arm64, and Windows x86_64.
# ---------------------------------------------------------------------------
[ship]
enabled = true
sign = false
require_qualification = false
targets = ["x86_64-unknown-linux-gnu"]

[ship.installers]
shell = false
tauri = false

[ship.stable]
push_tag = false            # annotated tag is created and pushed before ship runs
prerelease = false
draft = false
release_notes = true
require_qualification = false

[ship.nightly]
push_tag = false
draft = true
require_qualification = false
release_notes = true
retain_count = 7

[[ship.app_stores]]
kind = "github-releases"
draft = false
prerelease = false
