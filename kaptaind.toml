# Stable release overrides. Publishes a non-prerelease GitHub release, tags the
# repo as `v{VERSION}`, and generates release notes from commits since the
# previous stable release.
# [ship.stable]
# targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
# channels = ["binaries", "github-releases"]
# push_tag = true
# require_qualification = true
# release_notes = true
#
# Nightly release overrides. Publishes a prerelease with a version like
# `0.1.2-nightly.20260707.abc1234`, skips qualification gates by default, and
# skips re-shipping the same date+commit unless `--force` is used.
# [ship.nightly]
# targets = ["x86_64-unknown-linux-gnu"]
# channels = ["binaries", "github-releases"]
# draft = true
# push_tag = false
# require_qualification = false
# release_notes = true
# retain_count = 7
#
# Automated daemon-driven release trains. When enabled, the scheduler will run
# the ship pipeline on the configured cron schedule, log to audit, and send
# nautical release notifications.
# [ship.auto_nightly]
# enabled = false
# schedule = "0 2 * * *"      # min hour day month weekday
# cron_timezone = "local"     # "local" or "utc"
# require_qualification = false
#
# [ship.auto_stable]
# enabled = false
# schedule = "0 9 * * 1"      # e.g. 09:00 every Monday
# cron_timezone = "local"
# require_qualification = true
#
# SLSA provenance attestation for release artifacts.
