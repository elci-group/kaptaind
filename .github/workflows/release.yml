name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
      # Workspace member bumps ([versioning].workspace = "touched") change the
      # member manifest without touching VERSION; they only need a member tag.
      - 'crates/kaptaind-diff/Cargo.toml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect bumped versions
    runs-on: ubuntu-latest
    outputs:
      root: ${{ steps.detect.outputs.root }}
      root_version: ${{ steps.detect.outputs.root_version }}
      kaptaind_diff: ${{ steps.detect.outputs.kaptaind_diff }}
      kaptaind_diff_version: ${{ steps.detect.outputs.kaptaind_diff_version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      # A bump is pending when the tag CI cuts for it does not exist yet.
      # (fetch-depth: 0 makes all tags visible locally.) To re-run a release
      # that failed after its tag was pushed, delete the tag and re-dispatch.
      - name: Detect bumped versions
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          ROOT_VERSION="$(tr -d '[:space:]' < VERSION)"
          DIFF_VERSION="$(awk -F'"' '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version = /{print $2; exit}' crates/kaptaind-diff/Cargo.toml)"
          echo "root_version=${ROOT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "kaptaind_diff_version=${DIFF_VERSION}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v${ROOT_VERSION}" >/dev/null; then
            echo "root=false" >> "$GITHUB_OUTPUT"
          else
            echo "root=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${DIFF_VERSION}" ] && ! git rev-parse -q --verify "refs/tags/kaptaind-diff-v${DIFF_VERSION}" >/dev/null; then
            echo "kaptaind_diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "kaptaind_diff=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.root == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            tool: cargo
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            tool: cross
          - name: macos-x86_64
            # macos-13 runners are retired (jobs queue forever); macos-14 is
            # arm64 hardware and cross-compiles x86_64-apple-darwin fine.
            os: macos-14
            target: x86_64-apple-darwin
            tool: cargo
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            tool: cargo
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            tool: cargo
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: ${{ matrix.os }}-${{ matrix.target }}

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install cross (Linux arm64)
        if: matrix.tool == 'cross'
        run: cargo install cross --locked

      - name: Build (cargo)
        if: matrix.tool != 'cross'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.tool == 'cross'
        run: cross build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          STAGE="pkg"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp "target/${TARGET}/release/kaptaind" "$STAGE/kaptaind"
          cp "target/${TARGET}/release/kaptaind-cli" "$STAGE/kaptaind-cli"
          tar -czf "kaptaind-${VERSION}-${TARGET}.tar.gz" -C "$STAGE" kaptaind kaptaind-cli

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $VERSION = "${{ steps.version.outputs.version }}"
          $TARGET = "${{ matrix.target }}"
          $STAGE = "pkg"
          Remove-Item -Recurse -Force $STAGE -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $STAGE | Out-Null
          Copy-Item "target/$TARGET/release/kaptaind.exe" "$STAGE/kaptaind.exe"
          Copy-Item "target/$TARGET/release/kaptaind-cli.exe" "$STAGE/kaptaind-cli.exe"
          Compress-Archive -Path "$STAGE/kaptaind.exe", "$STAGE/kaptaind-cli.exe" `
            -DestinationPath "kaptaind-$VERSION-$TARGET.zip" -Force

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: kaptaind-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: kaptaind-${{ steps.version.outputs.version }}-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    needs: [changes, build]
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Download package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute SHA256SUMS
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS.txt

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30  # stable

      - name: Install cargo-cyclonedx
        # Version-pinned: upstream removed --output-pattern in a minor bump
        # and silently broke this step.
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      - name: Generate CycloneDX SBOM (sbom-rust.json)
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --override-filename bom
          # cargo cyclonedx emits one bom.json per workspace crate; the
          # release describes the root crate, so prefer it deterministically.
          SBOM="$(find . -maxdepth 1 -name 'bom.json' | head -n1 || true)"
          if [ -z "$SBOM" ]; then
            SBOM="$(find . -type f \( -name '*.cdx.json' -o -name 'bom.json' \) \
              -not -path './dist/*' | head -n1 || true)"
          fi
          if [ -z "$SBOM" ]; then
            echo "error: cargo cyclonedx produced no JSON SBOM" >&2
            exit 1
          fi
          cp "$SBOM" dist/sbom-rust.json
          echo "SBOM copied from $SBOM -> dist/sbom-rust.json"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3

      - name: Keyless-sign packages and checksums
        working-directory: dist
        run: |
          set -euo pipefail
          for f in *.tar.gz *.zip; do
            cosign sign-blob --yes "$f" \
              --output-signature "$f.sig" \
              --output-certificate "$f.cert"
          done
          cosign sign-blob --yes SHA256SUMS.txt \
            --output-signature SHA256SUMS.txt.sig \
            --output-certificate SHA256SUMS.txt.cert

      - name: Create and push annotated tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping."
          else
            git tag -a "$TAG" -m "Kaptaind ${TAG}"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Kaptaind v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.sig
            dist/SHA256SUMS.txt.cert
            dist/sbom-rust.json
            dist/*.sig
            dist/*.cert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  member-tags:
    name: Tag workspace member releases
    needs: changes
    if: needs.changes.outputs.kaptaind_diff == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Create and push kaptaind-diff tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="kaptaind-diff-v${{ needs.changes.outputs.kaptaind_diff_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; skipping."
          else
            git tag -a "${TAG}" -m "kaptaind-diff ${TAG}"
            git push origin "${TAG}"
          fi
