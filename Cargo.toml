[workspace]
members = [".", "crates/kaptaind-diff"]
resolver = "2"

[package]
name = "kaptaind"
version = "10.3.4"
edition = "2021"
license = "MIT"
default-run = "kaptaind"

[[bin]]
name = "kaptaind"
path = "src/cli/main.rs"

[[bin]]
name = "kaptaind-supervisor"
path = "src/supervisor/main.rs"

[[bin]]
name = "kaptaind-installer"
path = "src/installer/gui.rs"
required-features = ["gui"]

[dependencies]
kaptaind-diff = { path = "crates/kaptaind-diff" }
# form3, deckhand, and bound-core are consumed as pinned git dependencies so
# the project builds on a clean machine (CI, Docker, release) — a `path =
# "../sibling"` dependency only resolves on a machine with that sibling
# checked out next to this one, which broke every release build from
# 2026-08-31 onward once bound-core was added as a raw sibling path (CI has
# no such checkout). Bump `rev` deliberately to advance any of them. For
# local development against a sibling checkout, create a gitignored
# `.cargo/config.toml` with: paths = ["../3form", "../bound"]
form3 = { git = "https://github.com/elci-group/form3", rev = "0a3d331a771a1eb6266839c701ee213a44e5f514" }
deckhand = { git = "https://github.com/elci-group/deckhand", rev = "b5c221b6182e871ffeb150d050af518c4121a753" }
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
cron = "0.15"
petgraph = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
semver = { version = "1", features = ["serde"] }
globset = "0.4"
glob = "0.3"
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
libc = "0.2.184"
toml_edit = "0.25.10"
reqwest = { version = "0.13.2", features = ["json"] }
regex-lite = "0.1"
syn = { version = "2", features = ["full", "visit"] }
sha2 = "0.10"
bound-core = { git = "https://github.com/elci-group/bound", rev = "ef912a7dc900f162562fad86f000f56ae469130c" }
hmac = "0.12"
subtle = "2"
rand = "0.8"
tar = "0.4"
flate2 = "1"
fltk = { version = "1.4", optional = true }
notify-rust = { version = "4", optional = true }
axum = "0.7"
git2 = { version = "0.19", optional = true }
tokio-stream = { version = "0.1", features = ["sync"] }

[features]
gui = ["fltk"]
notifications = ["notify-rust"]
git2 = ["dep:git2"]

[dev-dependencies]
tempfile = "3"
divan = "0.1"
proptest = "1"
# Needed by tests/claims_audit.rs to construct timestamped FsEvents when
# locking the documented structural-score formula.
chrono = "0.4"

[[bench]]
name = "bench_cluster"
path = "tests/benches/bench_cluster.rs"
harness = false

[[bench]]
name = "bench_diff"
path = "tests/benches/bench_diff.rs"
harness = false

[[bench]]
name = "bench_adapters"
path = "tests/benches/bench_adapters.rs"
harness = false

[[bench]]
name = "bench_weight_version"
path = "tests/benches/bench_weight_version.rs"
harness = false

[[bench]]
name = "bench_compliance"
path = "tests/benches/bench_compliance.rs"
harness = false

[[bench]]
name = "bench_supervisor"
path = "tests/benches/bench_supervisor.rs"
harness = false
