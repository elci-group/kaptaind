[package]
name = "kaptaind"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
notify = "6"
git2 = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
petgraph = "0.6"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
semver = "1"
globset = "0.4"

[dev-dependencies]
tempfile = "3"
